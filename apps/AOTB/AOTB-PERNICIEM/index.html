<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Art of the Brick - Endangered Species</title>
  <meta name="i18n-default-lang" content="en" />
  <meta name="i18n-supported-langs" content="en,fr" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #071933;
      color: #ffffff;
      font: 600 18px/1.4 Inter, Arial, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
  <script>
    (() => {
      const target = new URL('../shared/aotb-map/index.html', window.location.href);
      const current = new URL(window.location.href);

      current.searchParams.forEach((value, key) => {
        const normalizedKey = String(key || '').trim();
        const normalizedValue = String(value || '').trim();
        if (!normalizedKey || !normalizedValue) return;
        target.searchParams.set(normalizedKey, normalizedValue);
      });

      target.searchParams.set('data', 'perniciem');
      target.searchParams.set('trackingApp', 'AOTB-PERNICIEM');
      target.searchParams.set('home', '../../AOTB-PERNICIEM/index.html');
      target.hash = current.hash;

      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <main>Loading Art of the Brick...</main>
</body>
</html>
