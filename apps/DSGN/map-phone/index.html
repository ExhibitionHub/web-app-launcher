<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="i18n-base" content="./lang/" />
  <meta name="i18n-default-lang" content="en" />
  <meta name="i18n-supported-langs" content="en,fr,ar,es" />
  <meta name="i18n-lock-lang" content="false" />
  <meta name="i18n-force-dir" content="ltr" />
  <meta name="i18n-title-key" content="meta.pageTitle" />
  <meta name="i18n-link-preserve" content="lang,availableLangs,primaryLang" />
  <meta name="kiosk-home" content="./index.html" />
  <meta name="kiosk-timeout-ms" content="25000" />
  <meta name="kiosk-warning-ms" content="10000" />
  <title data-i18n="meta.pageTitle"></title>
  <link rel="preload" href="./style/app.css?v=20260516a" as="style" />
  <link rel="preload" href="./lib/i18n.js?v=20260507a" as="script" />
  <link rel="stylesheet" href="./style/app.css?v=20260516a" />
</head>
<body>
  <main class="app-shell" data-screen="language">

    <button class="home-button" id="home-button" type="button" data-action="home" data-i18n-attr="aria-label:common.home;title:common.home" aria-label="Home" title="Home" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 11.5 12 4l9 7.5"></path>
        <path d="M5.5 10.5V20h13v-9.5"></path>
        <path d="M9.5 20v-6h5v6"></path>
      </svg>
      <span data-i18n="common.home">Home</span>
    </button>

    <!-- ─── LANGUAGE GATE ─────────────────────────────── -->
    <section class="screen screen--language" data-screen-panel="language" aria-labelledby="language-title">
      <div class="language-shell">
        <p class="language-eyebrow">DSGN FORENSIC MAP</p>
        <h1 id="language-title" class="language-title" data-i18n="language.title">Choose your language</h1>
        <p class="language-subtitle" data-i18n="language.subtitle">Select a language before starting the investigation.</p>
        <div class="language-choice-grid" aria-label="Language choices">
          <button class="language-choice" type="button" data-action="choose-language" data-lang-choice="en">
            <strong>English</strong>
            <small data-i18n="language.select">Select</small>
          </button>
          <button class="language-choice" type="button" data-action="choose-language" data-lang-choice="fr">
            <strong>Français</strong>
            <small data-i18n="language.select">Select</small>
          </button>
          <button class="language-choice" type="button" data-action="choose-language" data-lang-choice="ar">
            <strong>العربية</strong>
            <small data-i18n="language.select">Select</small>
          </button>
          <button class="language-choice" type="button" data-action="choose-language" data-lang-choice="es">
            <strong>Español</strong>
            <small data-i18n="language.select">Select</small>
          </button>
        </div>
      </div>
    </section>

    <!-- ─── IDLE / TUTORIAL ─────────────────────────────── -->
    <section class="screen screen--idle" data-screen-panel="intro" aria-labelledby="idle-title" hidden>
      <div class="idle-layout">

        <div class="idle-left">
          <p class="idle-eyebrow" data-i18n="intro.caseLabel"></p>
          <h1 id="idle-title" class="idle-title" data-i18n="intro.title"></h1>

          <figure class="idle-map-preview" aria-hidden="true">
            <img src="./ressource/images/map-rabat.png" alt="" />
            <figcaption>Rabat</figcaption>
          </figure>

          <p id="intro-faraday-brief" class="idle-faraday-brief"></p>
        </div>

        <div class="idle-right">
          <p class="idle-section-label" data-i18n="intro.briefing.tutorialTitle"></p>
          <div class="intro-step-grid" id="intro-step-grid"></div>
          <button class="btn-start" type="button" data-action="start" data-i18n="intro.cta"></button>
        </div>

      </div>
    </section>

    <!-- ─── ANALYSIS ──────────────────────────────────────── -->
    <section class="screen screen--analysis" data-screen-panel="analysis" aria-labelledby="analysis-title" hidden>

      <div class="map-entry-overlay" id="map-entry-overlay" aria-hidden="true">
        <div class="map-entry-overlay__stack" id="map-entry-stack"></div>
      </div>

      <header class="topbar">
        <p class="topbar__eyebrow" data-i18n="header.caseEyebrow"></p>
        <h2 id="analysis-title" class="topbar__title" data-i18n="header.title"></h2>
        <div class="topbar__badges">
          <span class="topbar__badge" data-bind="case-id"></span>
          <span class="topbar__badge topbar__badge--ghost" data-bind="case-location"></span>
        </div>
      </header>

      <div class="workspace">

        <!-- LEFT: Source buttons -->
        <aside class="panel panel--sources" aria-labelledby="sources-title">
          <p class="panel__label" data-i18n="sources.kicker"></p>
          <h3 id="sources-title" class="panel__title" data-i18n="sources.title"></h3>
          <p class="panel__instruction" id="source-instruction" data-i18n="analysis.instruction"></p>
          <div class="source-list" id="source-list"></div>
          <div class="selection-panel" id="suspect-panel" hidden>
            <p class="panel__label" data-i18n="suspects.kicker"></p>
            <h3 class="panel__title" data-i18n="suspects.title"></h3>
            <div class="suspect-list" id="suspect-list"></div>
          </div>
          <!-- Evidence popup slides in below the source list (single-slot) -->
          <div class="evidence-popups" id="evidence-popups" aria-live="polite"></div>
        </aside>

        <!-- CENTER: Map -->
        <section class="map-area" aria-labelledby="map-title">

          <div class="map-stage" id="map-stage" role="img" aria-live="polite" data-i18n-attr="aria-label:map.ariaLabel">

            <!-- map-canvas receives transform: scale(zoom) translate(x,y) from JS -->
            <div class="map-canvas" id="map-canvas">

              <!-- Background map image (URL set by MAP_CONFIG in app.js) -->
              <img class="map-bg" id="map-bg" aria-hidden="true" alt="">

              <!-- SVG overlay: routes + cell tower coverage zones -->
              <svg class="map-svg" viewBox="0 0 1000 620" preserveAspectRatio="none" aria-hidden="true">
                <path class="route route--phone"  id="route-phone"  pathLength="1" d="M 670 371 C 645 375, 605 365, 572 347"></path>
                <path class="route route--karim"  id="route-karim"  pathLength="1" d="M 740 327 C 720 328, 695 345, 670 371"></path>
                <path class="route route--samir"  id="route-samir"  pathLength="1" d="M 331 596 C 380 520, 470 430, 670 371"></path>
                <path class="route route--google" id="route-google" pathLength="1" d="M 740 327 C 720 260, 680 205, 620 161"></path>
                <circle class="tower-zone tower-zone--alpha" id="tower-zone-a" cx="355" cy="260" r="125"></circle>
                <circle class="tower-zone tower-zone--beta"  id="tower-zone-b" cx="450" cy="365" r="140"></circle>
                <circle class="tower-zone tower-zone--gamma" id="tower-zone-c" cx="600" cy="285" r="135"></circle>
              </svg>

              <!-- Cell tower markers (positioned via CSS %) -->
              <div class="tower-marker tower-marker--alpha" data-tower="a">
                <span class="tower-marker__pulse"></span>
                <div class="tower-marker__label">
                  <strong data-i18n="towers.a.name"></strong>
                  <span data-i18n="towers.a.caption"></span>
                </div>
              </div>
              <div class="tower-marker tower-marker--beta" data-tower="b">
                <span class="tower-marker__pulse"></span>
                <div class="tower-marker__label">
                  <strong data-i18n="towers.b.name"></strong>
                  <span data-i18n="towers.b.caption"></span>
                </div>
              </div>
              <div class="tower-marker tower-marker--gamma" data-tower="c">
                <span class="tower-marker__pulse"></span>
                <div class="tower-marker__label">
                  <strong data-i18n="towers.c.name"></strong>
                  <span data-i18n="towers.c.caption"></span>
                </div>
              </div>

              <!-- Location markers -->
              <div class="map-marker map-marker--victim is-visible" data-marker="victim-house">
                <span class="map-marker__dot"></span>
                <div class="map-marker__label">
                  <strong data-i18n="markers.victimHouse.name"></strong>
                  <span data-i18n="markers.victimHouse.caption"></span>
                </div>
              </div>
              <div class="map-marker map-marker--neighbor" data-marker="neighbor-house">
                <span class="map-marker__dot"></span>
                <div class="map-marker__label">
                  <strong data-i18n="markers.neighborHouse.name"></strong>
                  <span data-i18n="markers.neighborHouse.caption"></span>
                </div>
              </div>
              <div class="map-marker map-marker--police" data-marker="police-station">
                <span class="map-marker__dot"></span>
                <div class="map-marker__label">
                  <strong data-i18n="markers.policeStation.name"></strong>
                  <span data-i18n="markers.policeStation.caption"></span>
                </div>
              </div>
              <div class="map-marker map-marker--friend" data-marker="friend-house">
                <span class="map-marker__dot"></span>
                <div class="map-marker__label">
                  <strong data-i18n="markers.friendHouse.name"></strong>
                  <span data-i18n="markers.friendHouse.caption"></span>
                </div>
              </div>
              <div class="map-marker map-marker--karim" data-marker="karim-location">
                <span class="map-marker__dot"></span>
                <div class="map-marker__label">
                  <strong data-i18n="markers.karimLocation.name"></strong>
                  <span data-i18n="markers.karimLocation.caption"></span>
                </div>
              </div>

              <!-- Event chips -->
              <div class="event-chip event-chip--google" data-event="google-login" data-action="open-evidence" data-evidence="google-login">
                <span data-i18n="events.googleLogin.short"></span>
              </div>
              <div class="event-chip event-chip--delete-one" data-event="delete-attempt-1" data-action="open-evidence" data-evidence="delete-attempt-1">
                <span data-i18n="events.deleteAttemptOne.short"></span>
              </div>
              <div class="event-chip event-chip--delete-two" data-event="delete-attempt-2" data-action="open-evidence" data-evidence="delete-attempt-2">
                <span data-i18n="events.deleteAttemptTwo.short"></span>
              </div>
              <div class="event-chip event-chip--witness" data-event="witness-call" data-action="open-evidence" data-evidence="witness-call">
                <span data-i18n="events.witnessCall.short"></span>
              </div>

            </div><!-- /map-canvas -->
            <div class="map-controls" id="map-controls" aria-label="Map navigation">
              <button class="map-control-button" type="button" data-map-control="zoom-in" aria-label="Zoom in">
                <span aria-hidden="true">+</span>
              </button>
              <output class="map-controls__value" id="map-zoom-value" aria-live="polite">100%</output>
              <button class="map-control-button" type="button" data-map-control="zoom-out" aria-label="Zoom out">
                <span aria-hidden="true">-</span>
              </button>
              <button class="map-control-button" type="button" data-map-control="reset" aria-label="Reset map view">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 4v6h6"></path>
                  <path d="M5.5 13a7 7 0 1 0 2-5.2L4 10"></path>
                </svg>
              </button>
            </div>
            <div class="map-cellular-panel" id="map-cellular-panel" hidden></div>
          </div><!-- /map-stage -->

          <div class="map-footer">
            <div class="map-legend" id="map-legend"></div>
            <p class="map-caption" id="map-caption"></p>
          </div>

        </section><!-- /map-area -->

        <!-- RIGHT: Investigation Timeline -->
        <aside class="panel panel--context panel--timeline" aria-labelledby="timeline-title">
          <p class="panel__label" data-i18n="timeline.kicker"></p>
          <h3 id="timeline-title" class="panel__title" data-i18n="timeline.title"></h3>
          <div class="timeline-stream" id="timeline"></div>
        </aside>

        <!-- Hidden: JS state refs (not rendered in UI) -->
        <div aria-hidden="true" style="display:none">
          <article id="context-card"></article>
          <section id="detail-panel"></section>
          <section id="timeline-card"><p id="timeline-summary"></p></section>
        </div>

      </div><!-- /workspace -->

      <footer class="footer-bar">
        <div class="progress-rail" id="progress-rail"></div>
        <div class="footer-bar__actions">
          <button class="ghost-button" type="button" data-action="restart" data-i18n="footer.restart"></button>
          <button class="cta-button cta-button--small" type="button" data-action="conclusion" data-coach-anchor="conclusion" data-i18n="footer.conclusion"></button>
        </div>
      </footer>

    </section><!-- /analysis -->

    <!-- ─── CONCLUSION ──────────────────────────────────── -->
    <section class="screen screen--conclusion" data-screen-panel="conclusion" aria-labelledby="conclusion-title" hidden>
      <div class="conclusion-shell">
        <p class="case-kicker" data-i18n="conclusion.kicker"></p>
        <h2 id="conclusion-title" class="intro-title--compact" data-i18n="conclusion.title"></h2>
        <p class="conclusion-shell__summary" data-i18n="conclusion.summary"></p>
        <div class="conclusion-grid" id="conclusion-grid"></div>
        <div class="conclusion-quote">
          <strong data-i18n="conclusion.quote"></strong>
        </div>
        <div class="conclusion-shell__actions">
          <button class="ghost-button" type="button" data-action="back-to-analysis" data-i18n="conclusion.back"></button>
          <button class="btn-start" type="button" data-action="return-home" data-i18n="conclusion.restart"></button>
        </div>
      </div>
    </section>

    <button class="idle-reset" type="button" data-action="idle-reset" hidden></button>

    <!-- Fly-to-timeline animation overlay (used to ferry an evidence pill from the map to the right-side correlation timeline) -->
    <div class="fly-overlay" id="fly-overlay" aria-hidden="true"></div>
    <div class="coach-overlay" id="coach-overlay" aria-hidden="true"></div>
    <div class="inactivity-overlay" id="inactivity-overlay" aria-hidden="true">
      <div class="inactivity-card" role="status" aria-live="polite">
        <span class="inactivity-card__label" data-i18n="idleCountdown.label">Returning home in</span>
        <strong id="inactivity-countdown-value">9</strong>
      </div>
    </div>

  </main>

  <script src="./lib/i18n.js?v=20260507a"></script>
  <script src="../../../assets/tracking.js"></script>
  <script src="./src/app.js?v=20260517b" type="module"></script>
</body>
</html>
